[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "evog"
version = "0.1.0"
description = "Evidence-grounded group memory with experience-driven harness evolution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.10,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]

[project.scripts]
evog = "evog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evog"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README*", "LICENSE", "NOTICE", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "pyproject.toml", "uv.lock", ".env.example", ".gitignore", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
